<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="1200" height="630" fill="white"/>
  
  <!-- Логотип слева -->
  <g transform="translate(100, 165) scale(0.6)">
    <!-- Красный квадрат -->
    <rect width="512" height="512" fill="#E53935"/>
    <!-- Белая рамка -->
    <rect x="25" y="25" width="462" height="462" fill="white"/>
    <!-- Внутренний красный квадрат -->
    <rect x="50" y="50" width="412" height="412" fill="#E53935"/>
    <!-- Белый круг -->
    <circle cx="256" cy="256" r="156" fill="white"/>
    <!-- Красная точка в центре -->
    <circle cx="256" cy="256" r="52" fill="#E53935"/>
  </g>
  
  <!-- Текст справа -->
  <g transform="translate(500, 200)">
    <text font-family="Arial" font-size="48" fill="#333333" font-weight="bold">
      <tspan x="0" y="0">ЦЕНТР</tspan>
      <tspan x="0" y="60" font-size="72">ПОЖТЕХНИКА</tspan>
    </text>
    <text font-family="Arial" font-size="32" fill="#666666" x="0" y="150">
      Профессиональные решения
    </text>
    <text font-family="Arial" font-size="32" fill="#666666" x="0" y="200">
      для пожарной безопасности
    </text>
  </g>
</svg> 